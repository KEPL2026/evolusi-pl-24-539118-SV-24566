name: Deployment Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

  test:
    name: 2. Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Execute Tests
        run: php artisan test

  staging:
    name: 3. Staging
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging (Simulation)
        run: |
          echo "=========================================="
          echo "🚀 [STAGING] Starting Deployment..."
          echo "Simulasi deploy ke server staging..."
          echo "Menjalankan smoke test di staging..."
          echo "✅ [STAGING] Deployment Berhasil!"
          echo "=========================================="

  production:
    name: 4. Production
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute 7 Steps of deploy.sh
        run: |
          echo "========================================================"
          echo "🚀 [PRODUCTION] Memulai 7 Langkah Deployment (Slide 6)"
          echo "========================================================"
          echo "[1/7] Mengunci pintu aplikasi (maintenance mode):"
          echo "      php artisan down --retry=60"
          echo ""
          echo "[2/7] Mengambil kode terbaru dari repository:"
          echo "      git pull origin main"
          echo ""
          echo "[3/7] Memasang dependensi produksi (tanpa dev):"
          echo "      composer install --no-dev --optimize-autoloader"
          echo ""
          echo "[4/7] Memperbarui skema basis data secara otomatis:"
          echo "      php artisan migrate --force"
          echo ""
          echo "[5/7] Membangun ulang cache dengan kode & config baru:"
          echo "      php artisan config:cache"
          echo "      php artisan route:cache"
          echo "      php artisan view:cache"
          echo ""
          echo "[6/7] Memuat ulang pekerja antrean (queue workers):"
          echo "      php artisan queue:restart"
          echo ""
          echo "[7/7] Membuka kembali aplikasi untuk pengguna:"
          echo "      php artisan up"
          echo "========================================================"
          echo "✅ [PRODUCTION] Deployment simulation finished successfully!"
          echo "========================================================"
