name: Frontend Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: 1. Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  test:
    name: 2. Vitest Unit Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (Standalone without Laravel)
        run: npm run test

  build:
    name: 3. Build & Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload production artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    name: 4. Static Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Inspect dist directory contents (No rebuild allowed)
        run: |
          echo "========================================================"
          echo "[DEPLOY] Memeriksa isi folder dist/ dari job build..."
          echo "========================================================"
          ls -la dist/
          echo ""
          echo "Daftar file dalam dist/assets:"
          ls -la dist/assets/
          echo "========================================================"
          echo "[DEPLOY] Simulasi deploy ke static hosting selesai!"
          echo "========================================================"

